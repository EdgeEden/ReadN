<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ReadN - 云端多端 PDF 阅读器</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0F172A;
      color: #F8FAFC;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.35s ease-out, visibility 0.35s;
    }
    #loading-container.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .app-logo {
      width: 56px;
      height: 56px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4F46E5, #06B6D4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
    }
    .app-logo svg {
      width: 32px;
      height: 32px;
      fill: #FFFFFF;
    }
    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #FFFFFF;
    }
    .app-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="app-logo">
      <svg viewBox="0 0 24 24">
        <path d="M19 2H6c-1.2 0-2 .8-2 2v16c0 1.2.8 2 2 2h13c1.1 0 2-.9 2-2V4c0-1.2-.9-2-2-2zm0 18H6V4h2v8l2.5-1.5L13 12V4h6v16z"/>
      </svg>
    </div>
    <div class="app-title">ReadN</div>
    <div class="app-subtitle">正在加速载入阅读器引擎...</div>
    <div class="spinner"></div>
  </div>

  <script>
    // 0. Service Worker version detection & cache purge
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].update();
          }
        });

        fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function(response) { return response.json(); })
          .then(function(data) {
            if (data && data.version) {
              var currentStoredVersion = localStorage.getItem('readn_app_version');
              if (currentStoredVersion && currentStoredVersion !== data.version) {
                console.log('[ReadN] New version detected: ' + data.version + ' (was ' + currentStoredVersion + '). Purging caches...');
                localStorage.setItem('readn_app_version', data.version);
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    for (var j = 0; j < names.length; j++) {
                      caches.delete(names[j]);
                    }
                  });
                }
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  for (var k = 0; k < registrations.length; k++) {
                    registrations[k].unregister();
                  }
                  window.location.reload();
                });
              } else {
                localStorage.setItem('readn_app_version', data.version);
              }
            }
          })
          .catch(function(err) {
            console.warn('[ReadN] Version check bypassed:', err);
          });
      }
    })();

    function dismissLoadingScreen() {
      var loader = document.getElementById('loading-container');
      if (loader && !loader.classList.contains('loaded')) {
        loader.classList.add('loaded');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }

    // 1. Flutter first frame event
    window.addEventListener('flutter-first-frame', dismissLoadingScreen);

    // 2. Observe Flutter Web DOM elements insertion
    try {
      var observer = new MutationObserver(function(mutations) {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host')) {
          setTimeout(dismissLoadingScreen, 100);
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    } catch (e) {}

    // 3. Auto-start DWDS if running in web-server debug mode
    (function() {
      var maxAttempts = 200;
      var attempts = 0;
      function checkAndRunMain() {
        if (typeof window.$dartRunMain === 'function') {
          if (!window._dartMainStarted) {
            window._dartMainStarted = true;
            console.log('[ReadN] Auto-starting Flutter Dart main...');
            window.$dartRunMain();
          }
        } else if (attempts < maxAttempts) {
          attempts++;
          setTimeout(checkAndRunMain, 50);
        }
      }
      checkAndRunMain();
    })();

    // 4. Fallback safety timer
    setTimeout(dismissLoadingScreen, 4000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
