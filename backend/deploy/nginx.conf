# ==============================================================================
# ReadN Nginx Reverse Proxy Configuration
# Place in /etc/nginx/sites-available/readn or /etc/nginx/conf.d/readn.conf
# ==============================================================================

server {
    listen 80;
    server_name your-domain.com your-server-ip;

    # Allow large PDF file uploads (e.g. up to 500MB)
    client_max_body_size 500M;

    # API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for low-latency large file Byte-Range streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Static Web App Hosting (when built via `flutter build web`)
    location / {
        root /var/www/readn/web;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(?:css|js|woff2?|wasm|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}

